name: Test and Pages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Trust the checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select official Ubuntu archive
        timeout-minutes: 1
        run: node scripts/ci-ubuntu-mirror.cjs

      - name: Install Chromium and WebKit
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Chromium and WebKit
        timeout-minutes: 2
        run: |
          node --test tests/ci/browser-runtime.test.cjs
          node scripts/verify-ci-browsers.cjs

      - name: Run automated tests
        run: npm test

      - name: Exercise protected Game Night and rollback in workerd, Chromium and WebKit
        timeout-minutes: 5
        env:
          ARCADE_BROWSER_EVIDENCE: ${{ github.workspace }}/test-results/arcade-multiplayer
        run: |
          npm ci --prefix tests/runtime/durable-records
          npm run package:beta
          node tests/runtime/arcade-transport.mjs --relay
          node tests/runtime/arcade-transport.mjs --rollback
          ARCADE_SEPARATE_GUEST_RECOVERY=1 node tests/runtime/arcade-transport.mjs --browser=chromium --media
          ARCADE_SEPARATE_GUEST_RECOVERY=1 node tests/runtime/arcade-transport.mjs --browser=webkit
          node tests/runtime/arcade-transport.mjs --browser=chromium --webjam-share
          node tests/runtime/arcade-transport.mjs --browser=webkit --webjam-share

      - name: Verify protected newcomer admission and reconnect in fresh Worker storage
        timeout-minutes: 5
        env:
          ARCADE_BROWSER_EVIDENCE: ${{ github.workspace }}/test-results/arcade-multiplayer
          ARCADE_GUEST_RECOVERY_ONLY: '1'
        run: |
          node tests/runtime/arcade-transport.mjs --browser=chromium --media
          node tests/runtime/arcade-transport.mjs --browser=webkit

      - name: Verify independent Game Night guest tables
        timeout-minutes: 2
        env:
          ARCADE_GUEST_TABLE_ISOLATION_ONLY: '1'
        run: node tests/runtime/arcade-transport.mjs --browser=webkit

      - name: Exercise private WebJam room grants in workerd
        timeout-minutes: 6
        env:
          ARCADE_BROWSER_EVIDENCE: ${{ github.workspace }}/test-results/arcade-multiplayer
        run: |
          node tests/runtime/arcade-transport.mjs --room-grants
          node tests/runtime/arcade-transport.mjs --room-grants --browser=chromium --webjam-guest=stalemate
          node tests/runtime/arcade-transport.mjs --room-grants --browser=webkit --webjam-guest=rad-dad

      - name: Exercise Chess within a private WebJam room
        timeout-minutes: 4
        run: |
          node tests/runtime/arcade-transport.mjs --browser=chromium --webjam-chess=stalemate
          node tests/runtime/arcade-transport.mjs --room-grants --browser=chromium --webjam-chess=stalemate
          node tests/runtime/arcade-transport.mjs --room-grants --browser=webkit --webjam-chess=rad-dad

      - name: Exercise exact WebJam room grants in both browsers
        timeout-minutes: 4
        run: |
          node tests/runtime/arcade-transport.mjs --room-grants --browser=chromium --webjam-guest=stalemate --same-webjam-room
          node tests/runtime/arcade-transport.mjs --room-grants --browser=webkit --webjam-guest=rad-dad --same-webjam-room
          node tests/runtime/arcade-transport.mjs --room-grants --browser=chromium --webjam-chess=stalemate --webjam-host-confirm
          node tests/runtime/arcade-transport.mjs --room-grants --browser=webkit --webjam-chess=rad-dad --webjam-host-confirm

      - name: Verify private four-player Spades invitations
        timeout-minutes: 2
        run: |
          node tests/runtime/arcade-transport.mjs --room-grants --browser=chromium --webjam-spades=stalemate
          node tests/runtime/arcade-transport.mjs --room-grants --browser=webkit --webjam-spades=rad-dad

      - name: Build the shared-community entry toolkit
        shell: bash
        run: |
          set -euo pipefail
          node hangout-worker/tools/package-community-toolkit.mjs \
            --community-address https://stalemate-hangout-beta.jeffstory007.workers.dev/beta/ \
            --out "$RUNNER_TEMP/community-entry-toolkit"
          cat "$RUNNER_TEMP/community-entry-toolkit/SOURCE-MANIFEST.json"

      - name: Preserve the reviewed community entry toolkit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-entry-toolkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-entry-toolkit
          if-no-files-found: error
          retention-days: 7

      - name: Verify deployment checks at local root and project paths
        run: npm run test:live:local

      - name: Preserve Playwright evidence including first failures before retries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            live-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: stalemate-pages
      cancel-in-progress: false

    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package the public site
        run: npm run package:pages

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
