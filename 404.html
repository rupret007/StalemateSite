    <script>
        (function () {
            var PROJECT_BASE = '/StalemateSite/';
            var path = location.pathname || '/';
            var base = (PROJECT_BASE !== '/' && (path === PROJECT_BASE.slice(0, -1) || path.indexOf(PROJECT_BASE) === 0))
                ? PROJECT_BASE
                : '/';
            var tag = document.createElement('base');
            tag.href = base;
            document.head.insertBefore(tag, document.head.firstChild);
        }());
    </script>
