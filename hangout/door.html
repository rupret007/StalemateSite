<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hang Out</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#171410">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/hangout-app/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="door.css">
</head>
<body data-door-page>
    <a class="skip" href="#door-name">Skip to your name</a>
    <main class="sheet">
        <img class="brand-mark" src="../assets/hangout-app/webjam-mark.svg" alt="" width="72" height="72">
        <p class="eyebrow" data-door-kicker>Hang Out</p>
        <h1 data-door-title>Hang Out</h1>
        <p class="door-lead" data-door-lead role="status">This visit can't open this room.</p>
        <a class="door-home door-home--lead" data-door-home href="./">Hang Out home</a>
        <p class="lede door-step" data-door-step>Pick a name and jump in.</p>
        <p class="door-meta" data-door-meta hidden></p>
        <div class="door-form" data-door-form>
            <label for="door-name">Your name
                <input id="door-name" data-name maxlength="24" autocomplete="nickname" spellcheck="false">
            </label>
            <button class="door__enter door__enter--quiet" data-enter type="button">Jump in</button>
            <p class="door-status" data-door-status role="status"></p>
        </div>
    </main>
    <script type="module" src="door.mjs"></script>
</body>
</html>
