<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You’re offline · Hang Out</title>
    <meta name="theme-color" content="#171410">
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            background: #171410;
            color: #f4f0e6;
            font: 1.05rem/1.5 "Source Sans 3", "Segoe UI", sans-serif;
        }
        main { width: min(100%, 28rem); }
        p.eyebrow {
            margin: 0;
            color: #b5dc08;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        h1 {
            margin: 8px 0;
            font-family: "Arial Narrow", Impact, sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 0.95;
        }
        p { margin: 0; color: #c9bba9; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
        button, a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
        }
        button { border: 0; background: #b5dc08; color: #171410; cursor: pointer; }
        a { border: 1px solid rgba(244, 240, 230, 0.36); color: #f4f0e6; }
        :focus-visible { outline: 3px solid #b5dc08; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Hang Out</p>
        <h1>You’re offline</h1>
        <p>This page needs a connection. Check your signal, then try again.</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">Try again</button>
            <a href="./">Hang Out home</a>
        </div>
    </main>
</body>
</html>
