<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You’re offline, we’ll reconnect · Hang Out</title>
    <meta name="theme-color" content="#171410">
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            background: #171410;
            color: #f4f0e6;
            font: 1.05rem/1.5 "Source Sans 3", "Segoe UI", sans-serif;
        }
        main { width: min(100%, 28rem); }
        .mark { width: 88px; height: 88px; margin-bottom: 16px; }
        .mark svg { display: block; width: 100%; height: 100%; }
        p.eyebrow {
            margin: 0;
            color: #b5dc08;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        h1 {
            margin: 8px 0;
            font-family: "Arial Narrow", Impact, sans-serif;
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 0.95;
        }
        p { margin: 0; color: #c9bba9; }
        #retry-status { margin-top: 8px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
        button, a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
        }
        button { border: 0; background: #b5dc08; color: #171410; cursor: pointer; }
        a { border: 1px solid rgba(244, 240, 230, 0.36); color: #f4f0e6; }
        :focus-visible { outline: 3px solid #b5dc08; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                <defs>
                    <linearGradient id="hangout-offline-ribbon" x1="16%" y1="10%" x2="84%" y2="90%">
                        <stop offset="0%" stop-color="#E87900"/>
                        <stop offset="30%" stop-color="#F28A00"/>
                        <stop offset="67%" stop-color="#F06A00"/>
                        <stop offset="100%" stop-color="#BF5700"/>
                    </linearGradient>
                    <radialGradient id="hangout-offline-node" cx="34%" cy="32%" r="68%">
                        <stop offset="0%" stop-color="#F5A13A"/>
                        <stop offset="42%" stop-color="#E87900"/>
                        <stop offset="100%" stop-color="#E77600"/>
                    </radialGradient>
                </defs>
                <path fill="none" stroke="url(#hangout-offline-ribbon)" stroke-width="4.86" stroke-linecap="round" stroke-linejoin="round" d="M32.00 24.43 L35.61 24.63 L39.12 25.23 L42.45 26.20 L45.52 27.51 L48.23 29.13 L50.54 30.99 L52.37 33.02 L53.70 35.17 L54.48 37.36 L54.72 39.50 L54.41 41.52 L53.58 43.36 L52.25 44.94 L50.48 46.19 L48.33 47.08 L45.86 47.55 L43.16 47.58 L40.31 47.15 L37.39 46.26 L34.50 44.92 L31.72 43.16 L29.13 41.01 L26.80 38.54 L24.81 35.79 L23.19 32.84 L22.00 29.76 L21.26 26.64 L20.98 23.57 L21.16 20.62 L21.77 17.87 L22.79 15.40 L24.16 13.28 L25.84 11.57 L27.76 10.31 L29.84 9.54 L32.00 9.28 L34.16 9.54 L36.24 10.31 L38.16 11.57 L39.84 13.28 L41.21 15.40 L42.23 17.87 L42.84 20.62 L43.02 23.57 L42.74 26.64 L42.00 29.76 L40.81 32.84 L39.19 35.79 L37.20 38.54 L34.87 41.01 L32.28 43.16 L29.50 44.92 L26.61 46.26 L23.69 47.15 L20.84 47.58 L18.14 47.55 L15.67 47.08 L13.52 46.19 L11.75 44.94 L10.42 43.36 L9.59 41.52 L9.28 39.50 L9.52 37.36 L10.30 35.17 L11.63 33.02 L13.46 30.99 L15.77 29.13 L18.48 27.51 L21.55 26.20 L24.88 25.23 L28.39 24.63 L32.00 24.43 Z"/>
                <g fill="url(#hangout-offline-node)">
                    <circle cx="32" cy="9.28" r="4.22"/>
                    <circle cx="52.86" cy="44.35" r="4.22"/>
                    <circle cx="11.14" cy="44.35" r="4.22"/>
                </g>
                <g fill="#0A0A0A">
                    <circle cx="32" cy="9.28" r="2.24"/>
                    <circle cx="52.86" cy="44.35" r="2.24"/>
                    <circle cx="11.14" cy="44.35" r="2.24"/>
                </g>
            </svg>
        </div>
        <p class="eyebrow">Hang Out</p>
        <h1>You’re offline, we’ll reconnect</h1>
        <p id="retry-status" role="status">Trying again…</p>
        <div class="actions">
            <button type="button" id="retry-now">Try again</button>
            <a href="./">Hang Out home</a>
        </div>
    </main>
    <script type="module">
        import { startOfflineRetry } from './offline-retry.mjs';
        document.getElementById('retry-now').addEventListener('click', () => location.reload());
        startOfflineRetry({
            location,
            navigator,
            fetch: (...args) => fetch(...args),
            addEventListener: (...args) => addEventListener(...args),
            setTimeout: (fn, ms) => setTimeout(fn, ms),
            clearTimeout: (id) => clearTimeout(id),
            reload: () => location.reload(),
            setStatus(text) {
                const node = document.getElementById('retry-status');
                if (node) node.textContent = text;
            }
        });
    </script>
</body>
</html>
