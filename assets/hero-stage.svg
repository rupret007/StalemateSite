<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="heroTitle" preserveAspectRatio="xMidYMid slice">
  <title id="heroTitle">Placeholder stage photograph for Stalemate</title>
  <defs>
    <radialGradient id="wash" cx="40%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#302820"/>
      <stop offset="48%" stop-color="#1f1a16"/>
      <stop offset="100%" stop-color="#171410"/>
    </radialGradient>
    <radialGradient id="spotBlue" cx="24%" cy="16%" r="38%">
      <stop offset="0%" stop-color="#009ee8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#009ee8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotPink" cx="78%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#ed2765" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ed2765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171410" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#171410" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="floorCheck" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#171410"/>
      <rect x="32" width="32" height="32" fill="#f4f0e6"/>
      <rect y="32" width="32" height="32" fill="#f4f0e6"/>
      <rect x="32" y="32" width="32" height="32" fill="#171410"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <rect width="1600" height="900" fill="url(#spotBlue)"/>
  <rect width="1600" height="900" fill="url(#spotPink)"/>
  <rect y="620" width="1600" height="280" fill="url(#floorCheck)" opacity="0.16"/>
  <rect y="620" width="1600" height="280" fill="url(#floorFade)"/>
  <rect width="1600" height="900" fill="#171410" opacity="0.12"/>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
