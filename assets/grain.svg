<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="xerox" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g">
      <feFuncA type="table" tableValues="0 0.55 0.2 0.7 0.15"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#xerox)"/>
</svg>
